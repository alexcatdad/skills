name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: find skills tests -type f -name '*.sh' -exec shellcheck --shell=sh {} +
      - name: Scan Git history for secrets
        if: runner.os == 'Linux'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sha256sum --check --status <<EOF
          $GITLEAKS_SHA256  $archive
          EOF
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --no-color \
            --ignore-gitleaks-allow --log-opts='--all --full-history --diff-merges=first-parent' .
      - name: Validate packages and behavior
        run: sh tests/check.sh
      - name: Validate GitHub skill packaging when supported
        run: |
          if gh skill publish --help >/dev/null 2>&1; then
            gh skill publish --dry-run
          else
            echo 'SKIP: runner GitHub CLI does not provide gh skill; local structure and metadata checks passed.'
          fi
